#-------------------------------------------------------------------------------
# Default config properties
#-------------------------------------------------------------------------------

# DeliveryTaskHandler
# DeliveryTaskHandlerType = JMS | QUARTZ_JMS
deliveryTaskHandler.start=true
deliveryTaskHandler.type=JMS
deliveryTaskHandler.jms.destinationName=
deliveryTaskHandler.jms.receiveTimeout=3000

# DeliveryManager
# DeliveryManagerType = JMS
deliveryManager.type=JMS

# EventListener
# EventListenerType = SIMPLE_JMS | JMS | JMS_TEXT
eventListener.type=SIMPLE_JMS
# DestinationType = QUEUE | TOPIC
eventListener.jms.destinationType=QUEUE

# TransactionManager
# TransactionManagerType = ATOMIKOS
transactionManager.type=ATOMIKOS

# JMS
jms.broker.config=classpath:nl/clockwork/ebms/activemq.xml
jms.broker.username=
jms.broker.password=
jms.broker.start=false
jms.brokerURL=vm://localhost
jms.pool.minPoolSize=32
jms.pool.maxPoolSize=32
